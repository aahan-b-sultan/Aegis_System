services:
  aegis-core:
    build: .
    container_name: aegis_radar_system
    ports:
      - "8000:8000"
    volumes:
      # Map a specific volume for the database so logs persist
      - aegis_db_data:/app/db_storage
    environment:
      - MODULE_NAME=app.main
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1

# Define the volume for persistence
volumes:
  aegis_db_data: