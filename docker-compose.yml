services:
  aegis-core:
    build: .
    container_name: aegis_radar_system
    ports:
      - "8000:8000"
    volumes:
      # Map the app code
      - .:/app
      # Map the AI Models so the backend can load them
      - ./ai_models:/app/ai_models
      # Map the Data Lake so the radar can read CSVs
      - ./data_lake:/app/data_lake
      # Map the database so logs aren't lost when Docker stops
      - ./aegis.db:/app/aegis.db
    environment:
      # Tell Python not to generate .pyc files (keeps it clean)
      - PYTHONDONTWRITEBYTECODE=1
      # Ensure logs appear in real-time
      - PYTHONUNBUFFERED=1
    restart: always