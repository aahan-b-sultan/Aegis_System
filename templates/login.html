<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AEGIS | Secure Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#0b0f19] text-slate-50 font-mono h-screen flex items-center justify-center">

    <div class="w-full max-w-md p-8 bg-[#1e293b] border border-slate-700 rounded-lg shadow-[0_0_50px_rgba(161,99,247,0.15)]">
        <div class="text-center mb-8">
            <div class="text-4xl mb-2">📡</div>
            <h1 class="text-2xl font-bold text-[#A163F7] tracking-widest">AEGIS SYSTEM</h1>
            <p class="text-xs text-[#45E3FF] mt-1">RESTRICTED ACCESS // AUTHORIZED PERSONNEL ONLY</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-xs text-slate-400 mb-1">OPERATOR ID</label>
                <input type="text" id="username" class="w-full bg-[#0f172a] border border-slate-700 rounded p-3 text-white focus:border-[#A163F7] focus:outline-none transition-colors" placeholder="admin">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">PASSPHRASE</label>
                <input type="password" id="password" class="w-full bg-[#0f172a] border border-slate-700 rounded p-3 text-white focus:border-[#A163F7] focus:outline-none transition-colors" placeholder="••••••">
            </div>
            
            <button type="submit" class="w-full bg-[#6F88FC] hover:bg-[#5a75e6] text-white font-bold py-3 rounded transition-all shadow-[0_0_15px_rgba(111,136,252,0.3)]">
                AUTHENTICATE
            </button>
            <div id="error-msg" class="text-center text-[#FF7582] text-xs h-4"></div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-msg');

            // Send as Form Data (Standard OAuth2)
            const formData = new URLSearchParams();
            formData.append('username', username);
            formData.append('password', password);

            try {
                const res = await fetch('/api/v1/auth/token', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: formData
                });

                if (res.ok) {
                    const data = await res.json();
                    // Save Token to LocalStorage
                    localStorage.setItem('aegis_token', data.access_token);
                    // Redirect to Dashboard
                    window.location.href = '/';
                } else {
                    errorDiv.innerText = "ACCESS DENIED: Invalid Credentials";
                }
            } catch (err) {
                errorDiv.innerText = "SYSTEM ERROR: Connection Failed";
            }
        });
    </script>
</body>
</html>
